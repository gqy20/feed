<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="按账号与时间浏览 X、小红书的已采集内容。">
<title>Trail Feed · 阅读</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><script src="feed-data.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#reader">跳到阅读区</a>
<header class="topbar"><a class="brand" href="./">Trail<span> Feed</span></a><nav aria-label="页面导航"><a id="overview-open" href="overview.html">账号总览</a><a href="rss/all.xml" target="_blank" rel="noreferrer">RSS ↗</a></nav><span id="update" class="update">正在读取内容…</span></header>
<div class="workspace">
<section class="timeline" aria-label="帖子时间流">
<div class="pane-heading"><div><h1 id="timeline-title">全部内容</h1></div><span id="result-count" class="number" aria-live="polite"></span></div>
<div class="filters"><div id="selected-accounts" class="selected-accounts" aria-label="已选账号" hidden></div><div id="search-area" class="search-area"><label class="search"><span aria-hidden="true">⌕</span><input id="content-search" type="search" placeholder="搜索账号或内容" aria-label="搜索账号或内容" aria-controls="search-results" aria-expanded="false" autocomplete="off"></label><div id="search-results" class="search-results" role="region" aria-label="搜索建议" hidden></div></div>
<div class="filter-row"><select id="platform" aria-label="平台"><option value="all">全部平台</option><option value="twitter">X</option><option value="xhs">小红书</option></select><select id="period" aria-label="时间范围"><option value="all">全部时间</option><option value="1">今天</option><option value="7">近 7 天</option><option value="30">近 30 天</option></select><select id="media-filter" aria-label="图片筛选"><option value="all">全部内容</option><option value="images">有图片</option><option value="text">无图片</option></select><select id="post-sort" aria-label="内容排序"><option value="latest">最新</option><option value="oldest">最早</option><option value="likes">点赞最多</option></select></div>
<div class="filter-status"><span id="filter-summary"></span><button id="clear-filters">重置</button></div></div>
<div id="post-list" class="post-list" aria-live="polite"><p class="state">正在整理时间流…</p></div>
</section>
<main id="reader" class="reader" tabindex="-1"><div class="reader-toolbar"><button id="back-list" class="back-list">← 返回列表</button><div><button id="previous" aria-label="上一篇" disabled>←</button><span id="position"></span><button id="next" aria-label="下一篇" disabled>→</button></div></div><div id="reading-scroll" class="reading-scroll"><article id="article" class="reading-article"><div class="reader-empty"><span class="empty-mark">T.</span><h2>给内容一点空间</h2><p>从左侧时间流选择一条内容。</p></div></article></div></main>
</div>

<dialog id="lightbox" class="lightbox"><div class="lightbox-tools"><button id="image-previous" aria-label="上一张图片">←</button><span id="image-position"></span><button id="image-next" aria-label="下一张图片">→</button><button id="image-close" aria-label="关闭图片">×</button></div><img id="large-image" alt=""><p id="image-error" hidden>图片无法加载，可以尝试查看原图。</p><a id="original-image" target="_blank" rel="noreferrer">查看原图 ↗</a></dialog>
</body></html>
