<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trail Feed</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #fafaf8;
    --ink: #1d1d1f;
    --ink-soft: #55555c;
    --ink-faint: #8e8e96;
    --hairline: #e6e4de;
    --accent: #b3543f;
    --media-border: #eae8e2;
    --grid-0: #eceae4;
    --grid-1: #d4c4b8;
    --grid-2: #c4a494;
    --grid-3: #b3543f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17171a;
      --ink: #e7e5e0;
      --ink-soft: #a3a3ab;
      --ink-faint: #6d6d75;
      --hairline: #2a2a2f;
      --accent: #d08770;
      --media-border: #26262b;
      --grid-0: #222226;
      --grid-1: #3d3330;
      --grid-2: #5c433c;
      --grid-3: #8c5a48;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Serif SC", "Source Han Serif SC", "思源宋体", serif;
    line-height: 1.75;
    font-size: 15px;
  }
  .mono {
    font-family: "Source Code Pro", Consolas, monospace;
    font-weight: 500;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 48px 32px 96px; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 20px;
  }
  header h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.02em;
  }
  header h1 span { color: var(--accent); }
  header p { margin: 0; font-size: 12px; color: var(--ink-faint); line-height: 1.4; }

  /* ── 账号面板 ── */
  .accounts {
    margin-top: 20px; padding: 14px 16px;
    border: 1px solid var(--hairline); border-radius: 12px;
  }
  .accounts-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-faint); margin-bottom: 10px;
  }
  .accounts-head .count { font-weight: 600; color: var(--ink-soft); }
  .accounts-head .hint { margin-left: auto; font-size: 11px; }
  .accounts-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 6px 16px;
  }
  .account-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 3px 0;
  }
  .account-row a {
    color: var(--ink-soft); text-decoration: none; font-weight: 600;
    font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex-shrink: 1;
  }
  .account-row a:hover { color: var(--accent); }
  .account-row .platform-icon { width: 11px; height: 11px; flex-shrink: 0; }
  .account-row .platform-icon svg { width: 100%; height: 100%; display: block; }
  .account-row .grid {
    display: flex; gap: 2px; margin-left: auto; flex-shrink: 0;
  }
  .account-row .grid i {
    width: 7px; height: 7px; border-radius: 1.5px; display: block;
    background: var(--grid-0);
  }
  .account-row .grid i[data-l="1"] { background: var(--grid-1); }
  .account-row .grid i[data-l="2"] { background: var(--grid-2); }
  .account-row .grid i[data-l="3"] { background: var(--grid-3); }

  /* ── 时间线 ── */
  .day { margin-top: 40px; }
  .day-label {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .day-label::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  article { padding: 14px 0 4px; }
  article + article { border-top: 1px solid transparent; }

  .meta {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 12px; color: var(--ink-faint); line-height: 1.5;
  }
  .meta .author {
    font-size: 13px; color: var(--ink-soft); font-weight: 600;
    text-decoration: none; letter-spacing: 0.01em;
  }
  a.author:hover { color: var(--accent); }
  .meta .platform { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; letter-spacing: 0.06em; }
  .meta .platform svg { width: 13px; height: 13px; display: block; }
  .meta .metrics { color: var(--ink-faint); }
  .meta .time { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }

  .title {
    display: block; margin: 6px 0 0;
    font-size: 16px; font-weight: 600; line-height: 1.6;
    color: var(--ink); text-decoration: none; overflow-wrap: anywhere;
  }
  .title:hover { color: var(--accent); }
  .excerpt {
    margin: 2px 0 0; color: var(--ink-soft); font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .media { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .media img {
    width: 76px; height: 76px; object-fit: cover;
    border-radius: 3px; border: 1px solid var(--media-border);
  }

  .empty, .state {
    text-align: center; color: var(--ink-faint); padding: 64px 0; font-size: 13px;
  }
  a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trail<span> Feed</span></h1>
    <p id="meta" class="mono">LOADING</p>
  </header>
  <div id="accounts-panel"></div>
  <main id="list"></main>
</div>
<script>
(async () => {
  const metaEl = document.getElementById("meta");
  const listEl = document.getElementById("list");
  const accountsEl = document.getElementById("accounts-panel");

  async function load(path) {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return await response.json();
  }

  const XHS_PATH = "M22.405 9.879c.002.016.01.02.07.019h.725a.797.797 0 0 0 .78-.972.794.794 0 0 0-.884-.618.795.795 0 0 0-.692.794c0 .101-.002.666.001.777zm-11.509 4.808c-.203.001-1.353.004-1.685.003a2.528 2.528 0 0 1-.766-.126.025.025 0 0 0-.03.014L7.7 16.127a.025.025 0 0 0 .01.032c.111.06.336.124.495.124.66.01 1.32.002 1.981 0 .01 0 .02-.006.023-.015l.712-1.545a.025.025 0 0 0-.024-.036zM.477 9.91c-.071 0-.076.002-.076.01a.834.834 0 0 0-.01.08c-.027.397-.038.495-.234 3.06-.012.24-.034.389-.135.607-.026.057-.033.042.003.112.046.092.681 1.523.787 1.74.008.015.011.02.017.02.008 0 .033-.026.047-.044.147-.187.268-.391.371-.606.306-.635.44-1.325.486-1.706.014-.11.021-.22.03-.33l.204-2.616.022-.293c.003-.029 0-.033-.03-.034zm7.203 3.757a1.427 1.427 0 0 1-.135-.607c-.004-.084-.031-.39-.235-3.06a.443.443 0 0 0-.01-.082c-.004-.011-.052-.008-.076-.008h-1.48c-.03.001-.034.005-.03.034l.021.293c.076.982.153 1.964.233 2.946.05.4.186 1.085.487 1.706.103.215.223.419.37.606.015.018.037.051.048.049.02-.003.742-1.642.804-1.765.036-.07.03-.055.003-.112zm3.861-.913h-.872a.126.126 0 0 1-.116-.178l1.178-2.625a.025.025 0 0 0-.023-.035l-1.318-.003a.148.148 0 0 1-.135-.21l.876-1.954a.025.025 0 0 0-.023-.035h-1.56c-.01 0-.02.006-.024.015l-.926 2.068c-.085.169-.314.634-.399.938a.534.534 0 0 0-.02.191.46.46 0 0 0 .23.378.981.981 0 0 0 .46.119h.59c.041 0-.688 1.482-.834 1.972a.53.53 0 0 0-.023.172.465.465 0 0 0 .23.398c.15.092.342.12.475.12l1.66-.001c.01 0 .02-.006.023-.015l.575-1.28a.025.025 0 0 0-.024-.035zm-6.93-4.937H3.1a.032.032 0 0 0-.034.033c0 1.048-.01 2.795-.01 6.829 0 .288-.269.262-.28.262h-.74c-.04.001-.044.004-.04.047.001.037.465 1.064.555 1.263.01.02.03.033.051.033.157.003.767.009.938-.014.153-.02.3-.06.438-.132.3-.156.49-.419.595-.765.052-.172.075-.353.075-.533.002-2.33 0-4.66-.007-6.991a.032.032 0 0 0-.032-.032zm11.784 6.896c0-.014-.01-.021-.024-.022h-1.465c-.048-.001-.049-.002-.05-.049v-4.66c0-.072-.005-.07.07-.07h.863c.08 0 .075.004.075-.074V8.393c0-.082.006-.076-.08-.076h-3.5c-.064 0-.075-.006-.075.073v1.445c0 .083-.006.077.08.077h.854c.075 0 .07-.004.07.07v4.624c0 .095.008.084-.085.084-.37 0-1.11-.002-1.304 0-.048.001-.06.03-.06.03l-.697 1.519s-.014.025-.008.036c.006.01.013.008.058.008 1.748.003 3.495.002 5.243.002.03-.001.034-.006.035-.033v-1.539zm4.177-3.43c0 .013-.007.023-.02.024-.346.006-.692.004-1.037.004-.014-.002-.022-.01-.022-.024-.005-.434-.007-.869-.01-1.303 0-.072-.006-.071.07-.07l.733-.003c.041 0 .081.002.12.015.093.025.16.107.165.204.006.431.002 1.153.001 1.153zm2.67.244a1.953 1.953 0 0 0-.883-.222h-.18c-.04-.001-.04-.003-.042-.04V10.21c0-.132-.007-.263-.025-.394a1.823 1.823 0 0 0-.153-.53 1.533 1.533 0 0 0-.677-.71 2.167 2.167 0 0 0-1-.258c-.153-.003-.567 0-.72 0-.07 0-.068.004-.068-.065V7.76c0-.031-.01-.041-.046-.039H17.93s-.016 0-.023.007c-.006.006-.008.012-.008.023v.546c-.008.036-.057.015-.082.022h-.95c-.022.002-.028.008-.03.032v1.481c0 .09-.004.082.082.082h.913c.082 0 .072.128.072.128V11.19s.003.117-.06.117h-1.482c-.068 0-.06.082-.06.082v1.445s-.01.068.064.068h1.457c.082 0 .076-.006.076.079v3.225c0 .088-.007.081.082.081h1.43c.09 0 .082.007.082-.08v-3.27c0-.029.006-.035.033-.035l2.323-.003c.098 0 .191.02.28.061a.46.46 0 0 1 .274.407c.008.395.003.79.003 1.185 0 .259-.107.367-.33.367h-1.218c-.023.002-.029.008-.028.033.184.437.374.871.57 1.303a.045.045 0 0 0 .04.026c.17.005.34.002.51.003.15-.002.517.004.666-.01a2.03 2.03 0 0 0 .408-.075c.59-.18.975-.698.976-1.313v-1.981c0-.128-.01-.254-.034-.38 0 .078-.029-.641-.724-.998z";
  const X_PATH = "M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z";
  const PLATFORM = { twitter: "X", xhs: "小红书" };
  const ACCOUNT_URL = {
    twitter: (h) => "https://x.com/" + h,
    xhs: (h) => "https://www.xiaohongshu.com/user/profile/" + h
  };
  const GRID_DAYS = 30;

  const fmtTime = (iso) => new Date(iso).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
  const fmtDay = (iso) => {
    const d = new Date(iso), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yesterday = new Date(now.getTime() - 86400000).toDateString() === d.toDateString();
    if (sameDay) return "今天";
    if (yesterday) return "昨天";
    const sameYear = d.getFullYear() === now.getFullYear();
    return d.toLocaleDateString("zh-CN", sameYear ? { month: "long", day: "numeric" } : { year: "numeric", month: "long", day: "numeric" });
  };
  const dayKey = (iso) => new Date(iso).toDateString();

  const stripTitle = (post) => {
    if (!post.title || !post.text || !post.text.startsWith(post.title)) return post.text || "";
    return post.text.slice(post.title.length).replace(/^[\s:：,，-]+/, "").trim();
  };

  function makeLogo(platform) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", platform === "xhs" ? XHS_PATH : X_PATH);
    path.setAttribute("fill", platform === "xhs" ? "#ff2442" : "currentColor");
    svg.append(path);
    return svg;
  }

  // ── 加载 posts 和 follows ──
  let file, followsFile;
  try {
    file = await load("data/posts.json");
  } catch (error) {
    metaEl.textContent = "UNAVAILABLE";
    const p = document.createElement("p");
    p.className = "state";
    p.textContent = "数据读取失败：" + (error && error.message ? error.message : "未知错误");
    listEl.replaceChildren(p);
    return;
  }
  try { followsFile = await load("data/follows.json"); } catch { followsFile = null; }

  const posts = Array.isArray(file.posts) ? file.posts : [];
  metaEl.textContent = posts.length
    ? posts.length + " POSTS · " + new Date(file.updated_at || Date.now()).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false })
    : "EMPTY";

  // ── 账号面板（活跃度格子图）──
  if (followsFile && Array.isArray(followsFile.accounts) && followsFile.accounts.length > 0) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // 预计算每个账号最近 N 天每天的帖子数
    const dayCounts = new Map();
    for (const post of posts) {
      if (!post.created_at || !post.handle) continue;
      const d = new Date(post.created_at);
      d.setHours(0, 0, 0, 0);
      const diff = Math.floor((today - d) / 86400000);
      if (diff < 0 || diff >= GRID_DAYS) continue;
      const key = post.platform + "\n" + post.handle + "\n" + diff;
      dayCounts.set(key, (dayCounts.get(key) || 0) + 1);
    }

    const panel = document.createElement("div");
    panel.className = "accounts";

    const head = document.createElement("div");
    head.className = "accounts-head";
    const countEl = document.createElement("span");
    countEl.className = "count";
    countEl.textContent = followsFile.accounts.length + " 个账号";
    head.append(countEl);
    const rssLink = document.createElement("a");
    rssLink.href = "rss/all.xml";
    rssLink.target = "_blank";
    rssLink.style.fontSize = "11px";
    rssLink.style.color = "var(--ink-faint)";
    rssLink.textContent = "RSS ↗";
    rssLink.style.marginLeft = "auto";
    rssLink.style.textDecoration = "none";
    head.append(rssLink);
    panel.append(head);

    const grid = document.createElement("div");
    grid.className = "accounts-grid";

    // 按优先级排序
    const sorted = [...followsFile.accounts].sort((a, b) => (b.priority || 0) - (a.priority || 0));

    for (const account of sorted) {
      const row = document.createElement("div");
      row.className = "account-row";

      const icon = document.createElement("span");
      icon.className = "platform-icon";
      icon.append(makeLogo(account.platform));
      row.append(icon);

      const link = document.createElement("a");
      link.href = ACCOUNT_URL[account.platform] ? ACCOUNT_URL[account.platform](account.handle) : "#";
      link.target = "_blank";
      link.rel = "noreferrer";
      link.title = account.handle;
      link.textContent = account.name || (account.platform === "twitter" ? "@" + account.handle : account.handle);
      row.append(link);

      // 活跃度格子（30 天，从左到右 = 从旧到新）
      const cells = document.createElement("span");
      cells.className = "grid";
      let total = 0;
      for (let d = GRID_DAYS - 1; d >= 0; d--) {
        const count = dayCounts.get(account.platform + "\n" + account.handle + "\n" + d) || 0;
        total += count;
        const cell = document.createElement("i");
        if (count > 0) {
          cell.dataset.l = count >= 5 ? "3" : count >= 2 ? "2" : "1";
        }
        cells.append(cell);
      }
      row.title = (account.name || account.handle) + " · 近 " + GRID_DAYS + " 天 " + total + " 条";
      row.append(cells);
      grid.append(row);
    }
    panel.append(grid);
    accountsEl.append(panel);
  }

  // ── 时间线 ──
  if (posts.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "还没有记录。Trail 扩展发布第一批数据后，这里会显示时间线。";
    listEl.replaceChildren(p);
    return;
  }

  const fragment = document.createDocumentFragment();
  let currentDay = null;
  let dayEl = null;

  for (const post of posts) {
    const key = post.created_at ? dayKey(post.created_at) : "unknown";
    if (key !== currentDay) {
      currentDay = key;
      dayEl = document.createElement("section");
      dayEl.className = "day";
      const label = document.createElement("div");
      label.className = "day-label mono";
      label.textContent = post.created_at ? fmtDay(post.created_at) : "未知时间";
      dayEl.append(label);
      fragment.append(dayEl);
    }

    const article = document.createElement("article");

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = post.author || (post.platform === "twitter" ? "@" + post.handle : post.handle || "");
    const accountHref = post.handle && ACCOUNT_URL[post.platform] ? ACCOUNT_URL[post.platform](post.handle) : null;
    const author = document.createElement(accountHref ? "a" : "span");
    author.className = "author";
    author.textContent = name;
    if (accountHref) { author.href = accountHref; author.target = "_blank"; author.rel = "noreferrer"; }
    meta.append(author);
    const platform = document.createElement("span");
    platform.className = "platform mono";
    platform.title = PLATFORM[post.platform] || post.platform;
    platform.append(makeLogo(post.platform));
    meta.append(platform);
    const m = post.metrics || {};
    const metrics = [];
    if (typeof m.likes === "number") metrics.push("赞 " + m.likes);
    if (typeof m.collects === "number") metrics.push("藏 " + m.collects);
    if (typeof m.retweets === "number") metrics.push("转 " + m.retweets);
    if (metrics.length > 0) {
      const el = document.createElement("span");
      el.className = "metrics";
      el.textContent = metrics.join(" / ");
      meta.append(el);
    }
    if (post.created_at) {
      const time = document.createElement("span");
      time.className = "time mono";
      time.textContent = fmtTime(post.created_at);
      meta.append(time);
    }
    article.append(meta);

    const bodyText = stripTitle(post);
    if (post.title || bodyText) {
      const title = document.createElement("a");
      title.className = "title";
      title.href = typeof post.url === "string" ? post.url : "#";
      title.target = "_blank";
      title.rel = "noreferrer";
      title.textContent = post.title || bodyText;
      article.append(title);
    }
    if (post.title && bodyText) {
      const text = document.createElement("p");
      text.className = "excerpt";
      text.title = bodyText;
      text.textContent = bodyText;
      article.append(text);
    }

    if (Array.isArray(post.media) && post.media.length > 0) {
      const media = document.createElement("div");
      media.className = "media";
      for (const url of post.media.slice(0, 6)) {
        if (typeof url !== "string") continue;
        const image = document.createElement("img");
        image.src = url;
        image.alt = "";
        image.loading = "lazy";
        image.referrerPolicy = "no-referrer";
        media.append(image);
      }
      if (media.childElementCount > 0) article.append(media);
    }

    dayEl.append(article);
  }
  listEl.replaceChildren(fragment);
})();
</script>
</body>
</html>
